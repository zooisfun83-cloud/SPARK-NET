<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SparkNet | Premium Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f0ff; --accent: #bc13fe; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { transition: background-color 0.5s ease, color 0.5s ease; word-break: break-word; font-family: 'Pretendard', sans-serif; }
        body.dark-mode { background: #030303; color: #f8f8f8; }
        body.light-mode { background: #eef2f5; color: #1a1a1a; }
        
        .glass { background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease; }
        body.light-mode .glass { --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); }
        .glass:hover { box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3); }

        .hashtag { color: #00f0ff !important; font-weight: 800; cursor: pointer; text-shadow: 0 0 8px rgba(0, 240, 255, 0.4); transition: 0.2s; }
        .hashtag:hover { text-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }
        .mention { color: #bc13fe !important; font-weight: 800; cursor: pointer; text-shadow: 0 0 8px rgba(188, 19, 254, 0.4); transition: 0.2s; }
        .mention:hover { text-shadow: 0 0 15px rgba(188, 19, 254, 0.8); }

        .btn-grad { background: linear-gradient(135deg, var(--neon), var(--accent)); color: black; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); transition: all 0.3s ease; }
        .btn-grad:hover { box-shadow: 0 6px 20px rgba(188, 19, 254, 0.5); filter: brightness(1.2); }

        input[type=range] { -webkit-appearance: none; width: 100px; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--neon); cursor: pointer; margin-top: -5px; box-shadow: 0 0 10px var(--neon); transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(128, 128, 128, 0.3); border-radius: 2px; }
        body.light-mode input[type=range]::-webkit-slider-runnable-track { background: rgba(0, 0, 0, 0.2); }

        .hidden { display: none !important; }
        #brightnessOverlay { pointer-events: none; mix-blend-mode: multiply; z-index: 9999; transition: opacity 0.1s; }

        /* 삭제 애니메이션용 클래스 */
        .fade-out { transform: scale(0.95); opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="dark-mode">

    <div id="brightnessOverlay" class="fixed inset-0 bg-black opacity-0"></div>

    <div id="notif" onclick="this.classList.add('hidden')" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[300] glass px-8 py-4 rounded-full border border-cyan-400 hidden cursor-pointer shadow-cyan-500/50 shadow-2xl transition-all"></div>

    <div id="profilePage" class="fixed inset-0 z-[150] hidden overflow-y-auto backdrop-blur-3xl bg-black/80">
        <header class="sticky top-0 z-10 p-6 sm:p-10 flex items-center gap-6 border-b border-white/10 bg-inherit">
            <button onclick="closeProfile()" class="w-12 h-12 rounded-full glass flex items-center justify-center hover:bg-cyan-500 hover:text-black transition"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-cyan-400 to-purple-600 flex items-center justify-center text-2xl font-black text-white shadow-lg shadow-purple-500/30" id="pAvatar"></div>
            <div class="flex-1 overflow-hidden">
                <h2 id="pTitle" class="text-3xl font-black italic truncate tracking-tight"></h2>
                <p id="pStat" class="opacity-60 text-xs mt-1 font-semibold tracking-widest"></p>
            </div>
        </header>
        <div id="pFeed" class="max-w-3xl mx-auto p-6 sm:p-10 space-y-8"></div>
    </div>

    <div id="loginPage" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/90 backdrop-blur-xl p-6">
        <div class="glass p-10 sm:p-14 rounded-[40px] text-center w-full max-w-md border-t border-white/20">
            <h1 class="text-5xl font-black mb-10 italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 drop-shadow-lg">SPARKNET</h1>
            <input type="text" id="uIn" placeholder="Master ID" class="w-full bg-black/30 p-5 rounded-2xl mb-4 border border-white/10 text-white outline-none focus:border-cyan-400 transition">
            <input type="password" id="pIn" placeholder="Password" class="w-full bg-black/30 p-5 rounded-2xl mb-10 border border-white/10 text-white outline-none focus:border-cyan-400 transition">
            <button onclick="auth()" class="w-full py-5 rounded-2xl btn-grad font-black text-lg uppercase tracking-widest">Boot System</button>
        </div>
    </div>

    <header class="fixed top-0 w-full z-50 p-5 sm:p-6 flex justify-between items-center bg-transparent backdrop-blur-xl border-b border-white/5">
        <h1 class="text-2xl font-black italic tracking-tighter">SPARKNET</h1>
        <div class="flex items-center gap-4 sm:gap-6">
            <div class="flex items-center gap-2 bg-black/20 px-4 py-2 rounded-full border border-white/10 hidden sm:flex">
                <i class="fa-solid fa-moon text-[10px] opacity-50"></i>
                <input type="range" id="brightSlider" min="0" max="100" value="100" oninput="adjustBrightness(this.value)">
                <i class="fa-solid fa-sun text-[10px] text-cyan-400"></i>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-white/10 transition"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button onclick="logout()" class="text-xs font-bold text-red-500 hover:text-red-400 tracking-widest px-2">EXIT</button>
        </div>
    </header>

    <main id="main" class="hidden max-w-3xl mx-auto pt-32 px-4 sm:px-6">
        <div class="glass p-8 sm:p-10 rounded-[40px] mb-12 relative border-t border-white/20">
            <textarea id="postIn" oninput="checkMention(this)" placeholder="기록을 남기세요..." class="w-full bg-transparent border-none outline-none text-xl sm:text-2xl resize-none mb-6 font-medium placeholder-gray-500" rows="3"></textarea>
            <div id="mentionList" class="hidden absolute glass rounded-2xl p-2 z-[500] w-56 shadow-2xl border-cyan-500/30"></div>
            <div id="filePreview" class="flex gap-3 mb-6"></div>
            <div class="flex justify-between items-center pt-6 border-t border-white/10">
                <div class="flex items-center gap-4">
                    <input type="file" id="fileIn" class="hidden" accept="image/*" onchange="previewFile()">
                    <button onclick="document.getElementById('fileIn').click()" class="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-xl hover:bg-cyan-500 hover:text-black transition"><i class="fa-solid fa-camera"></i></button>
                </div>
                <button onclick="send()" class="px-10 py-4 rounded-full btn-grad font-black text-sm tracking-widest uppercase">Post Spark</button>
            </div>
        </div>
        <div id="feed" class="space-y-8 pb-24"></div>
    </main>

    <script>
        const socket = io();
        let myName = "", users = [], allPosts = [], attachedFile = null;

        window.onload = () => {
            const savedTheme = localStorage.getItem('spark_theme') || 'dark-mode';
            document.body.className = savedTheme;
            const savedBright = localStorage.getItem('spark_bright') || 100;
            document.getElementById('brightSlider').value = savedBright;
            adjustBrightness(savedBright);

            const savedID = localStorage.getItem('spark_id');
            const savedPW = localStorage.getItem('spark_pw');
            if(savedID && savedPW) socket.emit('auth_request', { name: savedID, password: savedPW });
        };

        function adjustBrightness(val) {
            const overlay = document.getElementById('brightnessOverlay');
            const opacity = 0.8 - (val / 100 * 0.8);
            overlay.style.opacity = opacity;
            localStorage.setItem('spark_bright', val);
        }

        function auth() {
            const name = document.getElementById('uIn').value;
            const password = document.getElementById('pIn').value;
            socket.emit('auth_request', { name, password });
            localStorage.setItem('temp_pw', password);
        }

        socket.on('auth_success', (d) => {
            myName = d.name;
            localStorage.setItem('spark_id', myName);
            localStorage.setItem('spark_pw', document.getElementById('pIn').value || localStorage.getItem('temp_pw'));
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
        });

        socket.on('auth_fail', (msg) => alert(msg));
        function logout() { localStorage.clear(); location.reload(); }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            localStorage.setItem('spark_theme', isDark ? 'dark-mode' : 'light-mode');
        }

        function formatContent(text) {
            if(!text) return "";
            return text
                .replace(/#(\S+)/g, '<span class="hashtag">#$1</span>')
                .replace(/@(\S+)/g, '<span class="mention" onclick="viewProfile(\'$1\')">@$1</span>');
        }

        function previewFile() {
            const file = document.getElementById('fileIn').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                attachedFile = e.target.result;
                document.getElementById('filePreview').innerHTML = `
                    <div class="relative group">
                        <img src="${attachedFile}" class="w-24 h-24 object-cover rounded-2xl border-2 border-cyan-500 shadow-lg">
                        <button onclick="removeFile()" class="absolute -top-3 -right-3 bg-red-500 rounded-full w-7 h-7 text-xs text-white font-bold opacity-0 group-hover:opacity-100 transition shadow-lg">X</button>
                    </div>`;
            };
            reader.readAsDataURL(file);
        }
        function removeFile() { attachedFile = null; document.getElementById('filePreview').innerHTML = ""; }

        socket.on('user_list', list => users = list);
        function checkMention(el) {
            const list = document.getElementById('mentionList');
            const match = el.value.match(/@(\w*)$/);
            if (match) {
                const search = match[1];
                const filtered = users.filter(u => u.startsWith(search));
                list.innerHTML = filtered.map(u => `<div class="p-3 hover:bg-cyan-500 hover:text-black cursor-pointer rounded-xl transition font-bold" onclick="applyMention('${u}')">@${u}</div>`).join('');
                list.classList.toggle('hidden', filtered.length === 0);
            } else { list.classList.add('hidden'); }
        }
        function applyMention(name) {
            const input = document.getElementById('postIn');
            input.value = input.value.replace(/@\w*$/, `@${name} `);
            document.getElementById('mentionList').classList.add('hidden');
        }

        socket.on('mention_notification', d => {
            if(d.target === myName) {
                const box = document.getElementById('notif');
                box.innerHTML = `<i class="fa-solid fa-bell text-white mr-2"></i> ${d.sender}님이 언급했습니다!`;
                box.classList.remove('hidden');
                setTimeout(() => box.classList.add('hidden'), 5000);
            }
        });

        function send() {
            const content = document.getElementById('postIn').value;
            if(!content && !attachedFile) return;
            socket.emit('new_spark', { id: Date.now().toString(), name: myName, content, file: attachedFile });
            document.getElementById('postIn').value = "";
            removeFile();
        }

        // 🔥 삭제 기능 관련 함수
        function deletePost(postId) {
            if(confirm("이 기록을 영구적으로 삭제하시겠습니까?")) {
                socket.emit('delete_post', { postId, userName: myName });
            }
        }

        socket.on('post_deleted', postId => {
            // 메인 피드와 프로필 창 모두에서 실시간으로 찾아 부드럽게 지움
            const postsToDel = document.querySelectorAll(`#post-${postId}`);
            postsToDel.forEach(el => {
                el.classList.add('fade-out');
                setTimeout(() => el.remove(), 300);
            });
            // 전체 배열에서도 제거
            allPosts = allPosts.filter(p => p.id !== postId);
            
            // 프로필 창 통계 업데이트
            const pStat = document.getElementById('pStat');
            if(pStat && !document.getElementById('profilePage').classList.contains('hidden')) {
                const viewName = document.getElementById('pTitle').innerText.replace('@', '');
                const count = allPosts.filter(p => p.name === viewName).length;
                pStat.innerText = `TOTAL RECORDS: ${count}`;
            }
        });

        socket.on('receive_spark', post => { allPosts.unshift(post); renderPost(post, 'feed', true); });
        socket.on('initial_load', posts => { allPosts = posts; posts.forEach(p => renderPost(p, 'feed', false)); });

        function renderPost(post, targetId, isNew) {
            const formatted = formatContent(post.content);
            const div = document.createElement('div');
            div.className = "glass p-6 sm:p-10 rounded-[40px] mb-8 group transition-all duration-300"; // 애니메이션 대비
            div.id = `post-${post.id}`;
            
            // 🔥 작성자가 '나'일 경우에만 휴지통 아이콘 표시
            const deleteBtn = (post.name === myName)
                ? `<button onclick="deletePost('${post.id}')" class="w-10 h-10 rounded-full text-red-500 opacity-0 group-hover:opacity-100 transition hover:bg-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>`
                : ``;

            div.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3 cursor-pointer w-max" onclick="viewProfile('${post.name}')">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-sm font-black text-white shadow-md">${post.name.charAt(0)}</div>
                        <span class="text-cyan-400 font-bold tracking-wide group-hover:underline decoration-cyan-400">@${post.name}</span>
                    </div>
                    ${deleteBtn}
                </div>
                ${post.file ? `<img src="${post.file}" class="w-full rounded-[28px] mb-6 shadow-xl border border-white/10 max-h-[500px] object-cover">` : ''}
                <p class="text-lg sm:text-xl mb-8 leading-relaxed font-medium">${formatted}</p>
                <div class="flex gap-8 border-t border-white/10 pt-5">
                    <button onclick="like('${post.id}')" class="flex items-center gap-2 text-sm font-bold opacity-60 hover:opacity-100 hover:text-red-500 transition"><i class="fa-solid fa-heart"></i> <span class="lc">${post.likes || 0}</span></button>
                    <button onclick="toggleComm('${post.id}')" class="flex items-center gap-2 text-sm font-bold opacity-60 hover:opacity-100 hover:text-cyan-400 transition"><i class="fa-solid fa-comment"></i> COMMENT</button>
                </div>
                <div id="csect-${post.id}" class="hidden mt-6 space-y-4 bg-black/20 p-5 rounded-3xl border border-white/5">
                    <div class="clist text-sm space-y-3"></div>
                    <div class="flex gap-3 mt-4">
                        <input type="text" class="flex-1 bg-black/40 border border-white/10 p-4 rounded-2xl outline-none text-sm focus:border-cyan-400 transition" placeholder="의견을 남기세요 (@소환 가능)">
                        <button onclick="sendComm(this, '${post.id}')" class="px-6 btn-grad font-bold rounded-2xl text-xs tracking-widest uppercase">Send</button>
                    </div>
                </div>`;
            const f = document.getElementById(targetId);
            isNew ? f.prepend(div) : f.appendChild(div);
            if(post.comments) post.comments.forEach(c => addCommUI(post.id, c));
        }

        function viewProfile(userName) {
            const page = document.getElementById('profilePage');
            document.getElementById('pTitle').innerText = `@${userName}`;
            document.getElementById('pAvatar').innerText = userName.charAt(0).toUpperCase();
            const pFeed = document.getElementById('pFeed');
            pFeed.innerHTML = "";
            const userPosts = allPosts.filter(p => p.name === userName);
            document.getElementById('pStat').innerText = `TOTAL RECORDS: ${userPosts.length}`;
            userPosts.forEach(p => renderPost(p, 'pFeed', false));
            page.classList.remove('hidden');
        }
        function closeProfile() { document.getElementById('profilePage').classList.add('hidden'); }

        function like(postId) { socket.emit('like_post', { postId, userName: myName }); }
        socket.on('update_likes', d => { 
            const posts = document.querySelectorAll(`#post-${d.postId} .lc`);
            posts.forEach(el => el.innerText = d.likes);
        });
        function toggleComm(id) { document.getElementById(`csect-${id}`).classList.toggle('hidden'); }
        function sendComm(btn, postId) {
            const i = btn.previousElementSibling;
            if(!i.value) return;
            socket.emit('new_comment', { postId, comment: { name: myName, text: i.value } });
            i.value = "";
        }
        socket.on('receive_comment', d => addCommUI(d.postId, d.comment));
        function addCommUI(pid, c) {
            const lists = document.querySelectorAll(`#post-${pid} .clist`);
            const formattedComm = formatContent(c.text);
            lists.forEach(list => list.innerHTML += `<div class="flex items-start gap-3 bg-white/5 p-3 rounded-2xl"><div class="font-bold text-cyan-400 shrink-0">${c.name}</div> <div class="opacity-90 leading-relaxed">${formattedComm}</div></div>`);
        }
    </script>
</body>
</html>
